name: Daily Fantasy Snapshot

on:
  schedule:
    # Ejecución diaria a las 04:00 UTC (tras el recálculo nocturno de mercado)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: fantasy-daily-snapshot
  cancel-in-progress: false

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run daily collection job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          B2C_TENANT: ${{ secrets.B2C_TENANT || 'laligadspprob2c' }}
          B2C_POLICY: ${{ secrets.B2C_POLICY || 'B2C_1A_5ULAIP_PARAMETRIZED_SIGNIN' }}
          B2C_CLIENT_ID: ${{ secrets.B2C_CLIENT_ID || '6457fa17-1224-416a-b21a-ee6ce76e9bc0' }}
          B2C_SCOPE: ${{ secrets.B2C_SCOPE || 'openid offline_access' }}
          FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
          FANTASY_TOKEN_JSON: ${{ secrets.FANTASY_TOKEN_JSON }}
        run: |
          python -m fantasy.collect.run_daily

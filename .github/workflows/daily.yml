name: Daily Fantasy Snapshot

on:
  # El disparo puntual lo hace Supabase con pg_cron a las 00:40 de España
  # (db/migrations/006_disparo_diario.sql): los cron de GitHub arrancaban con 4 a 7
  # horas de retraso (el de las 04:00 UTC salía entre las 08:13 y las 11:37).
  #
  # Estos de aquí son el respaldo, por si el disparo de Supabase falla. Pueden ser
  # varios porque el job mira primero si el día ya está completo y, si lo está,
  # termina en segundos. Hora UTC: España es UTC+1 en invierno y UTC+2 en verano.
  schedule:
    - cron: '43 23 * * *'   # 00:43 / 01:43 en España
    - cron: '13 2 * * *'    # 03:13 / 04:13
    - cron: '43 5 * * *'    # 06:43 / 07:43
    - cron: '13 8 * * *'    # 09:13 / 10:13 (ya guarda aunque el mercado no cambie)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recolectar aunque hoy ya esté hecho"
        type: boolean
        default: false

concurrency:
  group: fantasy-daily-snapshot
  cancel-in-progress: false

jobs:
  collect-snapshot:
    runs-on: ubuntu-latest
    # El job tarda ~8 min (detalle de ~813 jugadores). Con 30 se corta solo si algo
    # se queda colgado, en vez de consumir los minutos gratuitos del mes.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run daily collection job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Sin valores de respaldo aquí: si un secret no está definido llega vacío
          # y config.py aplica el valor verificado por defecto (única fuente de verdad).
          B2C_TENANT: ${{ secrets.B2C_TENANT }}
          B2C_TENANT_DOMAIN: ${{ secrets.B2C_TENANT_DOMAIN }}
          B2C_POLICY: ${{ secrets.B2C_POLICY }}
          B2C_CLIENT_ID: ${{ secrets.B2C_CLIENT_ID }}
          B2C_SCOPE: ${{ secrets.B2C_SCOPE }}
          FANTASY_LEAGUE_ID: ${{ secrets.FANTASY_LEAGUE_ID }}
          FANTASY_TOKEN_JSON: ${{ secrets.FANTASY_TOKEN_JSON }}
          # Solo el botón manual puede forzar; en el resto de disparos llega vacío.
          FORZAR_SNAPSHOT: ${{ inputs.forzar && '1' || '' }}
        run: |
          python -m fantasy.collect.run_daily
